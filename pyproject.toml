[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "subloom"
version = "0.1.0"
description = "Create context-aware translated subtitles for movies"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "MrCroxx" }]
dependencies = [
    "charset-normalizer>=3.4,<4",
    "httpx>=0.28,<1",
    "langcodes[data]>=3.5,<4",
    "openai>=2.15,<3",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[project.scripts]
subloom = "subloom.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/subloom"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["subloom"]
